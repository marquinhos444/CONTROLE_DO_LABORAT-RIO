<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitores - Controle de Laboratório</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="monitores">
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
      <div class="topo-pagina">
        <div>
          <h2>Monitores de Laboratório</h2>
          <p>Cadastre os monitores responsáveis por acompanhar o laboratório.</p>
        </div>
      </div>

      <div class="painel">
        <h3 id="tituloForm">Novo monitor</h3>
        <form id="formMonitor">
          <input type="hidden" id="monitorId">
          <div class="grid-form">
            <div class="campo">
              <label for="nome">Nome completo</label>
              <input type="text" id="nome" required placeholder="Ex: Maria Silva">
            </div>
            <div class="campo">
              <label for="email">E-mail institucional</label>
              <input type="email" id="email" required placeholder="monitor@instituicao.edu.br">
            </div>
            <div class="campo">
              <label for="turno">Turno</label>
              <select id="turno" required>
                <option value="">Selecione</option>
                <option value="Manhã">Manhã</option>
                <option value="Tarde">Tarde</option>
                <option value="Noite">Noite</option>
              </select>
            </div>
            <div class="campo">
              <label for="matricula">Matrícula (opcional)</label>
              <input type="text" id="matricula" placeholder="Ex: 2025001">
            </div>
          </div>
          <div class="acoes-form">
            <button type="submit" class="btn btn-primary" id="btnSalvar">Cadastrar monitor</button>
            <button type="button" class="btn btn-secondary" id="btnCancelar" style="display:none;">Cancelar edição</button>
          </div>
        </form>
      </div>

      <div class="painel">
        <h3>Monitores cadastrados</h3>
        <div class="tabela-wrap">
          <table>
            <thead>
              <tr>
                <th>Nome</th>
                <th>E-mail institucional</th>
                <th>Turno</th>
                <th>Matrícula</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="corpoTabela"></tbody>
          </table>
          <div id="tabelaVazia" class="tabela-vazia" style="display:none;">Nenhum monitor cadastrado ainda.</div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/db.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/monitores.js"></script>
</body>
</html>
